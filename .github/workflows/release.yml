# .github/workflows/release.yml
name: Release

on:
  push:
    branches: [main]

jobs:
  build-verification:
    name: Build Verification
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          bun run --filter @repo/validators build
          bun run --filter @repo/db build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          BETTER_AUTH_SECRET: build-placeholder-secret-32-chars-min!
          BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: uploads
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_REGION: us-east-1
          REDIS_URL: redis://localhost:6379
      - name: Build all
        run: bun run build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          BETTER_AUTH_SECRET: build-placeholder-secret-32-chars-min!
          BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: uploads
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_REGION: us-east-1
          REDIS_URL: redis://localhost:6379
      - name: Build success
        run: echo "Build successful on main"
