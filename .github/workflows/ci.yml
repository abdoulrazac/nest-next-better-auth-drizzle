# .github/workflows/ci.yml
name: CI

on:
  pull_request:
    branches: [main, develop]
  push:
    branches: [main, develop]

jobs:
  lint:
    name: Lint
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - run: bun lint
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder

  typecheck:
    name: Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          bun run --filter @repo/validators build
          bun run --filter @repo/db build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: bun check-types

  test-backend:
    name: Tests Backend
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: enterprise_test
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 5s
          --health-timeout 5s
          --health-retries 5
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          bun run --filter @repo/validators build
          bun run --filter @repo/db build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_test
      - name: Run migrations
        run: bun run --filter @repo/db db:migrate
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_test
      - name: Run e2e tests
        run: bun run --filter backend test:e2e
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/enterprise_test
          BETTER_AUTH_SECRET: test-secret-minimum-32-characters-long!!
          BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: test-bucket
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_REGION: us-east-1
          REDIS_URL: redis://localhost:6379
          NODE_ENV: test
          PORT: "0"

  build:
    name: Build
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: oven-sh/setup-bun@v2
        with:
          bun-version: latest
      - run: bun install --frozen-lockfile
      - name: Build workspace packages
        run: |
          bun run --filter @repo/validators build
          bun run --filter @repo/db build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
      - run: bun build
        env:
          DATABASE_URL: postgresql://postgres:postgres@localhost:5432/placeholder
          BETTER_AUTH_SECRET: build-placeholder-secret-32-chars-min!
          BETTER_AUTH_URL: http://localhost:3000
          S3_ENDPOINT: http://localhost:9000
          S3_BUCKET: uploads
          S3_ACCESS_KEY: minioadmin
          S3_SECRET_KEY: minioadmin
          S3_REGION: us-east-1
          REDIS_URL: redis://localhost:6379
