services:
  app:
    build:
      context: .
      target: runner-backend
    ports:
      - "3000:3000"
    environment:
      NODE_ENV: production
      PORT: 3000
      APP_NAME: ${APP_NAME:-MyApp}
      DATABASE_URL: postgres://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-postgres}@postgres:5432/${POSTGRES_DB:-app}
      DATABASE_SSL: "false" # set to "true" when using a managed DB with TLS
      REDIS_URL: redis://:${REDIS_PASSWORD:-changeme-redis-password}@redis:6379
      # Auth
      BETTER_AUTH_SECRET: ${BETTER_AUTH_SECRET:?BETTER_AUTH_SECRET is required}
      BETTER_AUTH_URL: ${BETTER_AUTH_URL:?BETTER_AUTH_URL is required}
      # CORS
      CORS_ORIGINS: ${CORS_ORIGINS:?CORS_ORIGINS is required}
      # S3 / MinIO
      S3_ENDPOINT: http://minio:9000
      S3_BUCKET: ${S3_BUCKET:-uploads}
      S3_ACCESS_KEY: ${MINIO_ROOT_USER:-minioadmin}
      S3_SECRET_KEY: ${MINIO_ROOT_PASSWORD:-minioadmin}
      S3_REGION: ${S3_REGION:-us-east-1}
      # SMTP (Mailpit)
      SMTP_HOST: mailpit
      SMTP_PORT: 1025
      SMTP_SECURE: "false"
      SMTP_USER: ${SMTP_USER:-test}
      SMTP_PASS: ${SMTP_PASS:-test}
      SMTP_FROM: ${SMTP_FROM:-no-reply@example.com}
    depends_on:
      postgres:
        condition: service_healthy
      redis:
        condition: service_healthy
      minio:
        condition: service_healthy
      mailpit:
        condition: service_started
      minio-init:
        condition: service_completed_successfully
    healthcheck:
      test:
        [
          "CMD-SHELL",
          "wget -q --spider http://127.0.0.1:3000/api/health || exit 1",
        ]
      interval: 10s
      timeout: 5s
      retries: 5
      start_period: 15s

  frontend:
    build:
      context: .
      target: runner-frontend
      args:
        # Baked at build time — set to the publicly accessible backend URL
        NEXT_PUBLIC_API_URL: ${NEXT_PUBLIC_API_URL:-http://localhost:3000}
    ports:
      - "3002:3000"
    environment:
      PORT: 3000
      NODE_ENV: production
    depends_on:
      app:
        condition: service_healthy

  web:
    build:
      context: .
      target: runner-web
    ports:
      - "3003:3000"
    environment:
      PORT: 3000
      NODE_ENV: production

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER:-postgres}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-postgres}
      POSTGRES_DB: ${POSTGRES_DB:-app}
    ports:
      # Bind to localhost only — do not expose the DB port to the public network
      - "127.0.0.1:5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-postgres}"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7-alpine
    # Require a password — same value must be reflected in REDIS_URL above
    command: redis-server --requirepass ${REDIS_PASSWORD:-changeme-redis-password} --appendonly yes
    ports:
      # Bind to localhost only
      - "127.0.0.1:6379:6379"
    volumes:
      - redis_data:/data
    healthcheck:
      test:
        [
          "CMD",
          "redis-cli",
          "-a",
          "${REDIS_PASSWORD:-changeme-redis-password}",
          "ping",
        ]
      interval: 5s
      timeout: 5s
      retries: 5

  minio:
    image: minio/minio:RELEASE.2024-11-07T00-52-20Z
    command: server /data --console-address ":9001"
    environment:
      MINIO_ROOT_USER: ${MINIO_ROOT_USER:-minioadmin}
      MINIO_ROOT_PASSWORD: ${MINIO_ROOT_PASSWORD:-minioadmin}
    ports:
      # Bind to localhost only — S3 API and console not exposed to public network
      - "127.0.0.1:9000:9000"
      - "127.0.0.1:9001:9001"
    volumes:
      - minio_data:/data
    healthcheck:
      test: ["CMD", "curl", "-f", "http://localhost:9000/minio/health/live"]
      interval: 5s
      timeout: 5s
      retries: 5

  mailpit:
    image: axllent/mailpit:latest
    ports:
      # Bind to localhost only — dev mail UI should never be public
      - "127.0.0.1:8025:8025"

  minio-init:
    image: minio/mc:latest
    depends_on:
      minio:
        condition: service_healthy
    entrypoint: >
      /bin/sh -c "
        mc alias set local http://minio:9000 ${MINIO_ROOT_USER:-minioadmin} ${MINIO_ROOT_PASSWORD:-minioadmin};
        mc mb --ignore-existing local/${S3_BUCKET:-uploads};
        mc anonymous set download local/${S3_BUCKET:-uploads};
        exit 0;
      "
    restart: on-failure

volumes:
  postgres_data:
  redis_data:
  minio_data:
